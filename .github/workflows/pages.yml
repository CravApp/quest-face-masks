name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # enablement crea el sitio de Pages (origen GitHub Actions) si aún no existe.
      # El GITHUB_TOKEN no tiene administration:write; si el primer run falla con
      # "Resource not accessible by integration", activa Pages una vez en
      # Settings → Pages → Source: GitHub Actions y vuelve a lanzar el workflow.
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
